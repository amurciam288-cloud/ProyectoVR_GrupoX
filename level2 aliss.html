<title>ARBERI JUEGO - NIVEL 2 JARDÍN</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:Courier New;
}

#ui-top{

    position:absolute;

    top:20px;

    left:20px;

    background:rgba(255,255,255,0.2);

    padding:15px;

    border:2px solid #ffffff;

    color:white;

    z-index:10;

    border-radius:15px;
}

</style>

<script>

AFRAME.registerComponent('motor-gameplay', {

    init:function(){

         this.ultimaPlataforma = null;
        this.puntos =
        parseInt(localStorage.getItem('puntajeAcumulado')) || 0;

        this.keys = {};

        this.puedeSaltar = true;

        this.actualizarUI();

        window.addEventListener('keydown',(e)=>{

            this.keys[e.code]=true;
        });

        window.addEventListener('keyup',(e)=>{

            this.keys[e.code]=false;
        });

        this.el.addEventListener('collide',(e)=>{

            const target = e.detail.body.el;

            if(!target) return;

            if(
    target.classList.contains('suelo')
    &&
    target !== this.ultimaPlataforma
){

    this.ultimaPlataforma = target;

    this.puntos += 300;

    this.actualizarUI();
}

            if(target.id==="lava"){

                location.reload();
            }

            if(target.id==="meta"){

                this.puntos += 8000;

                localStorage.setItem(
                    'puntajeAcumulado',
                    this.puntos
                );

                alert("¡NIVEL 2 COMPLETADO!");

                setTimeout(()=>{

                    window.location.href="juego2.html";

                },1500);
            }
        });
    },

    actualizarUI:function(){

        document.querySelector('#puntos-val')
        .innerText = this.puntos;
    },

    tick:function(){

        if(!this.el.body) return;

        let v = this.el.body.velocity;

        let f = 8;

        if(this.keys['KeyW']) v.z = -f;
        else if(this.keys['KeyS']) v.z = f;
        else v.z = 0;

        if(this.keys['KeyA']) v.x = -f;
        else if(this.keys['KeyD']) v.x = f;
        else v.x = 0;

        if(this.keys['Space']){

            if(Math.abs(v.y)<0.1
               && this.puedeSaltar){

                v.y = 13;

                this.puedeSaltar = false;
            }

        }else{

            this.puedeSaltar = true;
        }
    }
});

AFRAME.registerComponent('seguir-camara',{

    init:function(){

        this.player =
        document.querySelector('#jugador');
    },

    tick:function(){

        if(!this.player) return;

        this.el.object3D.position.lerp(

            this.player.object3D.position,

            0.05
        );
    }
});

</script>

</head>
