<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ARBERI JUEGO - COLMENA OBSTÁCULOS</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(#0a0010, #000000);
    font-family:Courier New;
}

#ui-top{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(0,0,0,0.8);
    padding:15px;
    border:2px solid #b300ff;
    color:#d580ff;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 25px #b300ff;
}

</style>

<script>

AFRAME.registerComponent('motor-gameplay', {

    init:function(){

        this.ultimaPlataforma = null;

        this.puntos =
        parseInt(localStorage.getItem('puntajeAcumulado')) || 0;

        this.keys = {};
        this.puedeSaltar = true;

        this.actualizarUI();

        window.addEventListener('keydown',(e)=>{
            this.keys[e.code]=true;
        });

        window.addEventListener('keyup',(e)=>{
            this.keys[e.code]=false;
        });

        this.el.addEventListener('collide',(e)=>{

            const target = e.detail.body.el;
            if(!target) return;

            if(target.classList.contains('suelo') && target !== this.ultimaPlataforma){

                this.ultimaPlataforma = target;
                this.puntos += 150;
                this.actualizarUI();
            }

            // 💥 trampas
            if(target.classList.contains('trap')){
                this.puntos -= 500;
                this.actualizarUI();
            }

            // ✨ meta
            if(target.id==="meta"){

                this.puntos += 20000;
                localStorage.setItem('puntajeAcumulado', this.puntos);

                alert("🏆 ¡FELICIDADES! HAS COMPLETADO TODOS LOS NIVELES 🏆");

setTimeout(()=>{
    window.location.href = "inde.html";
},1200);

                

                setTimeout(()=>location.reload(),1200);
            }
        });
    },

    actualizarUI:function(){
        document.querySelector('#puntos-val').innerText = this.puntos;
    },

    tick:function(){

        if(!this.el.body) return;

        let v = this.el.body.velocity;
        let f = 10;

        if(this.keys['KeyW']) v.z = -f;
        else if(this.keys['KeyS']) v.z = f;
        else v.z = 0;

        if(this.keys['KeyA']) v.x = -f;
        else if(this.keys['KeyD']) v.x = f;
        else v.x = 0;

        if(this.keys['Space']){
            if(this.puedeSaltar){
                v.y = 14;
                this.puedeSaltar = false;
            }
        }else{
            this.puedeSaltar = true;
        }
    }
});

AFRAME.registerComponent('seguir-camara',{

    init:function(){
        this.player = document.querySelector('#jugador');
    },

    tick:function(){
        if(!this.player) return;

        this.el.object3D.position.lerp(
            this.player.object3D.position,
            0.05
        );
    }
});

</script>

</head>

<body>

<div id="ui-top">
🐝 OBSTÁCULOS
<br>
PUNTOS: <span id="puntos-val">0</span>
</div>

<a-scene physics="gravity:-18">

<a-sky color="#050010"></a-sky>

<a-light type="ambient" intensity="0.6" color="#b300ff"></a-light>
<a-light type="directional" intensity="1.8"
position="10 20 10" color="#ff00ff"></a-light>

<!-- 🌌 suelo -->
<a-plane static-body rotation="-90 0 0"
width="400" height="400"
color="#120018"></a-plane>

<!-- 🟣 INICIO -->
<a-box class="suelo" static-body position="0 0 0"
width="8" height="0.5" depth="8"
color="#b300ff"></a-box>

<!-- ⚡ PLATAFORMA MÓVIL -->
<a-box class="suelo" static-body position="0 3 -10"
width="6" height="0.5" depth="6"
color="#7a00cc"
animation="property: position;
to: 5 3 -10;
dir: alternate;
dur: 1200;
loop: true"></a-box>

<!-- 💀 BARRA GIRATORIA -->
<a-box class="trap"
position="0 6 -18"
width="10" height="0.3" depth="0.3"
color="#ff0033"
animation="property: rotation;
to:0 0 360;
dur:1200;
loop:true"></a-box>

<!-- 🧱 PARED ESTRECHA -->
<a-box class="trap"
static-body position="2 8 -28"
width="0.5" height="6" depth="10"
color="#220022"></a-box>

<a-box class="trap"
static-body position="-2 8 -28"
width="0.5" height="6" depth="10"
color="#220022"></a-box>

<!-- 💥 SALTO LARGO -->
<a-box class="suelo" static-body position="0 12 -42"
width="4" height="0.5" depth="4"
color="#a64dff"></a-box>

<!-- 🧱 BLOQUE SUBE Y BAJA -->
<a-box class="suelo" static-body position="0 14 -52"
width="4" height="0.5" depth="4"
color="#b300ff"
animation="property: position;
to: 0 20 -52;
dir: alternate;
dur: 1500;
loop: true"></a-box>

<!-- 💀 SEGUNDA BARRA -->
<a-box class="trap"
position="0 18 -62"
width="12" height="0.3" depth="0.3"
color="#ff00aa"
animation="property: rotation;
to:0 0 -360;
dur:900;
loop:true"></a-box>

<!-- 👑 META -->
<a-entity id="meta" static-body position="0 24 -80">

<a-cylinder radius="3" height="6"
color="#ff00ff"
animation="property: rotation;
to:0 360 0;
dur:2000;
loop:true"></a-cylinder>

<a-text value="🐝 NIVEL OBSTÁCULOS 🐝"
align="center"
color="#ffffff"
position="0 6 0"
scale="10 10 10"></a-text>

</a-entity>

<!-- 🐝 JUGADOR -->
<a-entity id="jugador"
position="0 3 0"
motor-gameplay
dynamic-body="mass:2; fixedRotation:true">

<a-sphere radius="0.5" color="#ffccff"></a-sphere>

</a-entity>

<!-- 🎥 CÁMARA -->
<a-entity seguir-camara>
<a-camera position="0 7 14"
look-controls="enabled:false"
wasd-controls="enabled:false"></a-camera>
</a-entity>

</a-scene>

</body>
</html>
