<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ARBERI JUEGO - NIVEL DREAMY</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#ffddee;
    font-family:Courier New;
}

#ui-top{
    position:absolute;
    top:20px;
    left:20px;
    background:rgba(255,255,255,0.4);
    padding:15px;
    border:3px solid #ff9ecf;
    color:#ff4fa3;
    z-index:10;
    border-radius:20px;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 25px #ffb6d9;
    backdrop-filter:blur(5px);
}

</style>

<script>

AFRAME.registerComponent('motor-gameplay', {

    init:function(){

        this.plataformasVisitadas = new Set();

        this.puntos =
        parseInt(localStorage.getItem('puntajeAcumulado')) || 0;

        this.keys = {};

        this.puedeSaltar = true;

        this.actualizarUI();

        window.addEventListener('keydown',(e)=>{
            this.keys[e.code]=true;
        });

        window.addEventListener('keyup',(e)=>{
            this.keys[e.code]=false;
        });

        this.el.addEventListener('collide',(e)=>{

            const target = e.detail.body.el;

            if(!target) return;

            if(
                target.classList.contains('suelo')
                &&
                !this.plataformasVisitadas.has(target)
            ){

                this.plataformasVisitadas.add(target);

                this.puntos += 300;

                this.actualizarUI();
            }

            if(target.id==="lava"){

                location.reload();
            }

            if(target.id==="meta"){

                this.puntos += 8000;

                localStorage.setItem(
                    'puntajeAcumulado',
                    this.puntos
                );

                alert("🌸 NIVEL DREAMY COMPLETADO 🌸");

                setTimeout(()=>{

                    location.reload();

                     window.location.href="level3.html";

                },1500);
            }
        });
    },

    actualizarUI:function(){

        document.querySelector('#puntos-val')
        .innerText = this.puntos;
    },

    tick:function(){

        if(!this.el.body) return;

        let v = this.el.body.velocity;

        let f = 8;

        if(this.keys['KeyW']) v.z = -f;
        else if(this.keys['KeyS']) v.z = f;
        else v.z = 0;

        if(this.keys['KeyA']) v.x = -f;
        else if(this.keys['KeyD']) v.x = f;
        else v.x = 0;

        if(this.keys['Space']){

            if(Math.abs(v.y)<0.1
               && this.puedeSaltar){

                v.y = 13;

                this.puedeSaltar = false;
            }

        }else{

            this.puedeSaltar = true;
        }
    }
});

AFRAME.registerComponent('seguir-camara',{

    init:function(){

        this.player =
        document.querySelector('#jugador');
    },

    tick:function(){

        if(!this.player) return;

        const p = this.player.object3D.position;

        this.el.object3D.position.lerp(

            new THREE.Vector3(
                p.x,
                p.y + 5,
                p.z + 12
            ),

            0.05
        );
    }
});

</script>

</head>

<body>

<div id="ui-top">

🌸 PUNTOS:
<span id="puntos-val">0</span>

</div>

<a-scene
physics="gravity:-18"
background="color:#ffddee">

<!-- PISO -->

<a-plane
id="lava"
static-body
position="0 -6 0"
rotation="-90 0 0"
width="300"
height="300"
color="#7a3b69"

animation="property: material.color;
           dir: alternate;
           dur: 3000;
           loop: true;
           to: #a84f8d">
</a-plane>

<!-- SOL -->

<a-sphere
position="0 80 -100"
radius="10"
color="#fff0a8"

animation="property: scale;
           dir: alternate;
           dur: 3000;
           loop: true;
           to: 1.2 1.2 1.2">
</a-sphere>

<!-- NUBES -->

<a-sphere position="-20 40 -60" radius="6" color="white"></a-sphere>
<a-sphere position="-15 40 -60" radius="5" color="#fff5fa"></a-sphere>

<a-sphere position="25 35 -80" radius="7" color="white"></a-sphere>
<a-sphere position="30 35 -80" radius="5" color="#fff5fa"></a-sphere>

<!-- FLORES -->

<a-cylinder
position="5 -4 -10"
radius="0.1"
height="2"
color="#6ccf7d">
</a-cylinder>

<a-sphere
position="5 -2.5 -10"
radius="0.5"
color="#ff8fc8"

animation="property: scale;
           dir: alternate;
           dur:1000;
           loop:true;
           to:1.3 1.3 1.3">
</a-sphere>

<!-- PLATAFORMAS -->

<a-box
class="suelo"
static-body
position="0 0 0"
width="8"
height="0.5"
depth="8"
color="#ffcce5">
</a-box>

<a-box
class="suelo"
static-body
position="0 3 -10"
width="6"
height="0.5"
depth="6"
color="#ffd6f5"

animation="property: position;
           dir: alternate;
           dur: 2500;
           loop: true;
           to: 0 4 -10">
</a-box>

<a-box
class="suelo"
static-body
position="4 6 -18"
width="5"
height="0.5"
depth="5"
color="#ffe29a">
</a-box>

<a-box
class="suelo"
static-body
position="-3 9 -26"
width="5"
height="0.5"
depth="5"
color="#d9c2ff"

animation="property: rotation;
           to:0 360 0;
           dur:8000;
           loop:true">
</a-box>

<a-box
class="suelo"
static-body
position="5 12 -34"
width="4"
height="0.5"
depth="4"
color="#c7f0ff">
</a-box>

<a-box
class="suelo"
static-body
position="-4 15 -42"
width="4"
height="0.5"
depth="4"
color="#ffb6d9"

animation="property: material.emissive;
           dir: alternate;
           dur:1000;
           loop:true;
           to:#ffffff">
</a-box>

<a-box
class="suelo"
static-body
position="0 18 -52"
width="7"
height="0.5"
depth="7"
color="#d6fff0">
</a-box>

<!-- PUENTE -->

<a-box
class="suelo"
static-body
position="0 24 -78"
width="10"
height="0.4"
depth="2"
color="#ffc2e6"

animation="property: rotation;
           to:0 360 0;
           dur:6000;
           loop:true">
</a-box>

<!-- BARRAS -->

<a-box
static-body
position="0 26 -84"
width="12"
height="0.3"
depth="0.3"
color="#ff8fc8"

animation="property: rotation;
           to:0 0 360;
           dur:2000;
           loop:true">
</a-box>

<!-- META -->

<a-entity
id="meta"
static-body
position="0 32 -95">

<a-cylinder
radius="3"
height="6"
color="#ffb6d9"

animation="property: rotation;
           to:0 360 0;
           dur:4000;
           loop:true"

animation__scale="property: scale;
                  dir: alternate;
                  dur: 1500;
                  loop: true;
                  to: 1.2 1.2 1.2">
</a-cylinder>

<a-text
value="🌸 DREAMY COMPLETADO 🌸"
align="center"
color="white"
position="0 6 0"
scale="10 10 10">
</a-text>

</a-entity>

<!-- JUGADOR -->

<a-entity
id="jugador"
position="0 3 0"
motor-gameplay

dynamic-body="mass:2;
fixedRotation:true">

<a-sphere
radius="0.4"
color="#fff0f7">
</a-sphere>

<a-sphere
position="0 0.5 0"
radius="0.25"
color="#ff9ecf">
</a-sphere>

<!-- ALAS -->

<a-plane
position="-0.5 0.1 0"
width="0.7"
height="0.4"
color="#ffffff"
opacity="0.8"
rotation="0 0 40"

animation="property: rotation;
           to:0 0 70;
           dir:alternate;
           dur:400;
           loop:true">
</a-plane>

<a-plane
position="0.5 0.1 0"
width="0.7"
height="0.4"
color="#ffe6f2"
opacity="0.8"
rotation="0 0 -40"

animation="property: rotation;
           to:0 0 -70;
           dir:alternate;
           dur:400;
           loop:true">
</a-plane>

</a-entity>

<!-- CAMARA -->

<a-entity seguir-camara>

<a-camera
position="0 7 14"
look-controls="enabled:false"
wasd-controls="enabled:false">
</a-camera>

</a-entity>

<!-- LUCES -->

<a-light
type="ambient"
intensity="1"
color="#fff0f8">
</a-light>

<a-light
type="directional"
intensity="1.4"
position="10 20 0"
color="#ffffff">
</a-light>

</a-scene>

</body>
</html>
